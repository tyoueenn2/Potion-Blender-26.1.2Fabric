plugins {
    id 'net.fabricmc.fabric-loom'
}
version = rootProject.version
group = rootProject.group
base.archivesName = 'Potion-Blender-Fabric'
repositories {
    maven { url = 'https://maven.blamejared.com' }
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
}
sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
processResources {
    def properties = [version: project.version, mod_id: mod_id, mod_name: mod_name,
                      description: description, mod_author: mod_author,
                      fabric_loader_version: fabric_loader_version, minecraft_version: minecraft_version]
    inputs.properties properties
    filesMatching('fabric.mod.json') { expand properties }
}
jar {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_Potion-Blender' } }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'potionblender_test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}
