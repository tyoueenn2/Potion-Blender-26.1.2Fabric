name: Build Fabric 26.1.2
on:
  push:
    branches: ['release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build :Fabric:runGameTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Potion-Blender-Fabric-26.1.2
          path: Fabric/build/libs/*.jar
          if-no-files-found: error
